# Configuration Fly.io — Backend PRONO 2026
# Déploiement : cd backend && fly launch (la première fois) puis fly deploy
app = "prono2026-backend"
primary_region = "cdg"  # Paris (proche France)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DB_PATH = "/app/data/prono2026.db"
  SECRET_FILE = "/app/data/.jwt_secret"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0  # 0 = scale to zero (gratuit)

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/api/health"

# Volume persistant pour la DB SQLite
[mounts]
  source = "prono_data"
  destination = "/app/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256  # tier gratuit
