server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Sécurité : headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache long pour les assets versionnés (JS/CSS avec hash dans le nom)
    location ~* \.(js|css|woff2|woff|ttf|jpg|jpeg|png|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Proxy /api/* vers le backend (service Docker "backend")
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA fallback : toutes les autres routes retournent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache plus court pour index.html (pour permettre les updates)
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Pages SEO statiques : cache court (1h) pour permettre les updates
    location /seo/ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ============================================
    # LANDING PAGES SEO À URL PROPRE (sans .html)
    # ============================================
    # IMPORTANT : ces routes doivent être AVANT le `location /` qui fait fallback SPA.
    # Sinon nginx servirait index.html (la SPA React) au lieu de la page HTML statique,
    # et Google indexerait du contenu vide.

    location = /pronostics-coupe-du-monde-entre-amis {
        try_files /pronostics-coupe-du-monde-entre-amis.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /world-cup-predictions-with-friends {
        try_files /world-cup-predictions-with-friends.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /pronosticos-mundial-entre-amigos {
        try_files /pronosticos-mundial-entre-amigos.html =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # ============================================
    # FICHIERS SEO CRITIQUES (robots.txt, sitemap.xml)
    # ============================================
    # Headers explicites pour garantir l'accès aux crawlers (Bingbot, Googlebot).
    # On ne met PAS de gzip ici pour éviter tout problème de négociation avec
    # certains crawlers anciens (Bing notamment).

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Robots-Tag "noindex" always;  # Le fichier lui-même n'est pas indexé
        add_header Content-Type "text/plain; charset=utf-8" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "application/xml; charset=utf-8" always;
        try_files $uri =404;
    }

    # Bing peut tester ces URLs spécifiques pour la vérification de propriété
    location = /BingSiteAuth.xml {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
}

